<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Halaman tidak ditemukan</title>
  <!-- Font Awesome for the compass icon (free) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* Reset and base styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(145deg, #0b0c10 0%, #1f2833 100%);
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      color: #eaeef2;
      line-height: 1.5;
    }

    /* Main card container */
    .error-card {
      background: rgba(18, 25, 35, 0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(100, 210, 255, 0.2);
      border-radius: 3rem;
      padding: 3rem 2.5rem;
      max-width: 700px;
      width: 100%;
      box-shadow: 0 30px 45px -15px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(0, 255, 255, 0.05);
      text-align: center;
      transition: transform 0.25s ease, box-shadow 0.3s ease;
      animation: floatIn 0.8s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
    }

    .error-card:hover {
      box-shadow: 0 35px 55px -18px #00a6ff40, 0 0 0 1px #4fe3ff30;
      transform: scale(1.01);
    }

    /* Animated 404 number */
    .error-code {
      font-size: clamp(7rem, 25vw, 11rem);
      font-weight: 800;
      letter-spacing: 0.1em;
      line-height: 1;
      color: #fff;
      text-shadow: 0 0 15px #00b7ff, 0 0 35px #0077ff, 0 0 65px #003cff;
      margin-bottom: 1rem;
      animation: glitch 3.5s infinite alternate;
      display: inline-block;
      position: relative;
    }

    /* subtle glitch layers */
    .error-code::before,
    .error-code::after {
      content: "404";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0.7;
    }

    .error-code::before {
      color: #ff00c8;
      z-index: -1;
      animation: shiftLeft 0.9s infinite linear alternate-reverse;
    }

    .error-code::after {
      color: #00e0ff;
      z-index: -2;
      animation: shiftRight 1.1s infinite linear alternate-reverse;
    }

    /* Heading */
    h1 {
      font-size: clamp(1.8rem, 5vw, 2.7rem);
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 0.75rem;
      background: linear-gradient(to right, #ffffff, #b4e6ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    /* Description text */
    .description {
      font-size: 1.1rem;
      color: #a0b8cc;
      margin-bottom: 2.5rem;
      max-width: 450px;
      margin-left: auto;
      margin-right: auto;
      font-weight: 400;
      border-left: 2px solid #2a8fbd;
      padding-left: 1.25rem;
      text-align: left;
      background: linear-gradient(90deg, #1b2a36 0%, transparent 100%);
      border-radius: 0 8px 8px 0;
    }

    /* Action buttons container */
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 1.2rem;
      justify-content: center;
      margin-top: 1.8rem;
    }

    /* button styles */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      padding: 0.9rem 2rem;
      border-radius: 60px;
      font-weight: 600;
      font-size: 1rem;
      text-decoration: none;
      transition: all 0.25s ease;
      border: 1px solid transparent;
      cursor: pointer;
      background: #1f2b38;
      color: #d6e6f5;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.4);
      flex: 0 1 auto;
    }

    .btn-primary {
      background: linear-gradient(135deg, #0066ff, #00b7ff);
      color: white;
      border: none;
      box-shadow: 0 8px 18px #0066ff40, 0 0 0 1px #7fd4ff;
    }

    .btn-primary i {
      font-size: 1.1rem;
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #1a7cff, #2fc3ff);
      box-shadow: 0 12px 24px #0077ff70, 0 0 0 1px #9ae2ff;
      transform: translateY(-3px);
    }

    .btn-secondary {
      background: rgba(30, 45, 60, 0.7);
      border: 1px solid #3d5a70;
      backdrop-filter: blur(8px);
    }

    .btn-secondary i {
      color: #7ac7ff;
    }

    .btn-secondary:hover {
      background: #223544;
      border-color: #5fa3cc;
      transform: translateY(-3px);
      box-shadow: 0 12px 22px #00000060;
    }

    /* small hint below */
    .hint {
      margin-top: 2.5rem;
      font-size: 0.85rem;
      color: #5e7c94;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
      border-top: 1px dashed #2d4457;
      padding-top: 1.8rem;
    }

    .hint i {
      font-size: 0.9rem;
      color: #3c9fd9;
    }

    /* animations */
    @keyframes floatIn {
      0% {
        opacity: 0;
        transform: translateY(30px) scale(0.96);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes glitch {
      0% {
        text-shadow: 0 0 12px #00b7ff, 0 0 30px #0077ff, 0 0 50px #003cff;
      }
      50% {
        text-shadow: 0 0 18px #2fd0ff, 0 0 40px #0066ff, 0 0 70px #0022aa;
      }
      100% {
        text-shadow: 0 0 10px #00ccff, 0 0 25px #0055dd, 0 0 55px #001f99;
      }
    }

    @keyframes shiftLeft {
      0% {
        transform: translateX(-2px);
        opacity: 0.4;
      }
      100% {
        transform: translateX(3px);
        opacity: 0.2;
      }
    }

    @keyframes shiftRight {
      0% {
        transform: translateX(3px);
        opacity: 0.3;
      }
      100% {
        transform: translateX(-2px);
        opacity: 0.15;
      }
    }

    /* mobile fine-tune */
    @media (max-width: 480px) {
      .error-card {
        padding: 2rem 1.25rem;
        border-radius: 2rem;
      }

      .description {
        font-size: 1rem;
        padding-left: 1rem;
      }

      .btn {
        padding: 0.8rem 1.5rem;
        font-size: 0.95rem;
        width: 100%;
      }

      .actions {
        gap: 1rem;
      }

      .hint {
        font-size: 0.75rem;
      }
    }

    /* support for prefers-reduced-motion */
    @media (prefers-reduced-motion: reduce) {
      .error-card,
      .error-code,
      .error-code::before,
      .error-code::after {
        animation: none;
      }
      .error-card:hover {
        transform: none;
      }
    }
  </style>
</head>
<body>
  <main class="error-card" role="main" aria-labelledby="error-title">
    <!-- large 404 with glitch layers -->
    <div class="error-code" aria-hidden="true">404</div>

    <!-- visually hidden heading for screen readers -->
    <h1 id="error-title" class="sr-only">Halaman tidak ditemukan — 404</h1>

    <!-- visible heading -->
    <h1 aria-hidden="true">Oops! LidyaHijab masih proses nih :)</h1>

    <!-- description -->
    <p class="description">
      Halaman yang kamu cari masih dalam proses pengerjaan, jadi sabar dulu ya. 
      sambil tunggu kita ngopi dulu yuk.
    </p>

    <!-- action buttons -->
    <div class="actions">
      <a href="/" class="btn btn-primary" aria-label="Kembali ke beranda">
        <i class="fas fa-home"></i> Beranda
      </a>
      <a href="/kontak" class="btn btn-secondary" aria-label="Hubungi dukungan">
        <i class="fas fa-headset"></i> Bantuan
      </a>
    </div>

    <!-- little extra hint with compass icon -->
    <div class="hint" aria-hidden="true">
      <i class="fas fa-compass"></i>
      <span>periksa URL atau gunakan navigasi</span>
    </div>

    <!-- hidden for screen reader but keeps h1 accessible -->
    <style>
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border-width: 0;
      }
    </style>
  </main>
</body>
</html>
